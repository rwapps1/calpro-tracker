<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cal Pro Tracker</title>
<meta name="theme-color" content="#173404">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f3ef;--surface:#ffffff;--surface-2:#f6f7f3;--ink:#171a18;--muted:#5d655f;--line:#dcdfd8;
  --kcal:#c4740c;--kcal-soft:#fbecd3;--pro:#16766a;--pro-soft:#d5ede7;--over:#b8322a;--over-soft:#f8dcd9;
  --btn:#173404;--on-btn:#ffffff;--scrim:rgba(10,12,11,.45);--bar:#dfe9d3;--bar-edge:#173404;--bar-ink:#173404;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f130f;--surface:#181d18;--surface-2:#141914;--ink:#ecefea;--muted:#9ba49d;--line:#2b322c;
  --kcal:#f0a63a;--kcal-soft:#3a2a12;--pro:#4cc4ab;--pro-soft:#13332c;--over:#ff7c6e;--over-soft:#3d1c19;
  --btn:#cfe8b8;--on-btn:#10200a;--scrim:rgba(0,0,0,.6);--bar:#1d2b17;--bar-edge:#6f9f4f;--bar-ink:#cfe8b8;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(185px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
[hidden]{display:none!important}
button,label.btnlike{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pro);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;width:100%;min-width:0}
input::placeholder{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);flex:none}
.iconbtn svg{width:22px;height:22px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:16px}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em}
.of{color:var(--muted);font-size:14px;margin-left:4px}
.status{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.track{height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.fill{height:100%;border-radius:6px;transition:width .4s ease}
section h2{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
section h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .meta{font-size:12px;color:var(--muted)}
.row .vals{text-align:right;flex:none;font-size:14px}
.row .vals b{font-weight:600;color:var(--kcal)}
.row .vals span{display:block;color:var(--pro);font-weight:600}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;white-space:nowrap}
.chip em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.daynav{display:flex;align-items:center;gap:2px;min-width:0}
.navbtn{width:34px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.navbtn svg{width:22px;height:22px}
.navbtn.off{visibility:hidden}
.daytitle{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.01em;text-align:left;padding:0;line-height:1.2}
.linkbtn{color:var(--pro);font-weight:600;font-size:13px;text-decoration:underline;min-height:32px;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--body)}
.seg button{font-size:13px;padding:6px 10px;color:var(--muted);min-height:32px}
.seg button.on{background:var(--ink);color:var(--bg)}
.bars.b30{gap:2px}
.bars.b30 .bar{border-radius:3px}
.bars.b30 .bar i{border-radius:3px 3px 1px 1px}
.suggest{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:38vh;overflow-y:auto;overscroll-behavior:contain}
.suggest .row{min-height:50px;padding:9px 12px}
.suggest .sgh{font-size:12px;color:var(--muted);padding:8px 12px 4px}
.badge{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--pro-soft);color:var(--pro);margin-left:6px;vertical-align:1px}
.qopts{display:flex;gap:6px;flex-wrap:wrap}
.qo{min-width:46px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:600;font-variant-numeric:tabular-nums}
.qo.on{border:2px solid var(--ink);background:var(--surface);padding:0 9px}
.ckrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:54px;cursor:pointer}
.ckrow:last-child{border-bottom:0}
.ckrow input{width:22px;height:22px;flex:none}
.ckrow .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.avg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
.avg b{font-family:var(--display);font-size:20px;font-weight:700}
.bars{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:130px;align-items:end}
.bars .tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;pointer-events:none}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:8px;padding:0}
.bar i{display:block;border-radius:7px 7px 3px 3px;background:var(--kcal);min-height:3px}
.bar.over i{background:var(--over)}
.bar.today i{background:repeating-linear-gradient(45deg,var(--kcal),var(--kcal) 5px,var(--kcal-soft) 5px,var(--kcal-soft) 9px)}
.bar.sel{outline:2px solid var(--ink);outline-offset:2px}
.blabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:6px;text-align:center;font-size:12px}
.blabels div{color:var(--muted)}
.blabels .p{font-weight:600}
.blabels .p.hit{color:var(--pro)}
.daydetail{margin-top:12px}
.daydetail h3{font-size:14px;font-weight:600;margin:0 0 6px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.banner{background:var(--kcal-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.banner button{text-decoration:underline;font-weight:600}
/* sign in */
.signin{max-width:420px;margin:12vh auto 0;display:grid;gap:14px;text-align:center}
.signin img{width:84px;height:84px;margin:0 auto;border-radius:20px}
.signin h1{font-family:var(--display);margin:0;font-size:28px}
.signin form{display:grid;gap:10px;text-align:left}
/* add bar */
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);border-top:3px solid var(--bar-edge);border-radius:18px 18px 0 0;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.addbar .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.addlabel{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bar-ink)}
.addlabel svg{width:16px;height:16px}
.r1{display:flex;gap:8px}
.r2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px}
.addbtn{background:var(--btn);color:var(--on-btn);border-radius:10px;padding:0 20px;height:44px;font-weight:600}
.err{color:var(--over);font-size:13px}
/* sheet */
#scrim{touch-action:none;position:fixed;inset:0;background:var(--scrim);z-index:30}
html.locked,html.locked body{overflow:hidden;overscroll-behavior:none}
#sheet{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}.fill{transition:none}}
.sb{max-width:560px;margin:0 auto;display:grid;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0;overflow-wrap:anywhere}
.x{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.x svg{width:20px;height:20px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.conf{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px;text-transform:none;letter-spacing:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;min-height:52px;text-align:left;background:var(--surface-2)}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt.on{border:2px solid var(--ink);padding:9px;background:var(--surface)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.actions{display:flex;gap:8px}
.actions>*{flex:1;height:48px;border-radius:12px;font-weight:600;display:grid;place-items:center}
.primary{background:var(--btn);color:var(--on-btn)}
.secondary{border:1px solid var(--line);background:var(--surface)}
.danger{border:1px solid var(--over);color:var(--over)}
.danger.armed{background:var(--over);color:var(--surface)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;min-height:40px}
.check input{width:22px;height:22px}
.items{font-size:13px;color:var(--muted);display:grid;gap:2px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--kcal);animation:sp .9s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.prow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .row{border:0;flex:1}
.bigopt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px;min-height:60px;font-weight:600;cursor:pointer;background:var(--surface-2)}
.bigopt svg{width:24px;height:24px;flex:none}
/* scanner */
.scanbox{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;left:12%;right:12%;top:36%;height:28%;border:2px solid #f1efe8;border-radius:12px}
.scanbox .frame::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:2px solid #EF9F27}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(175px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast button{color:var(--bg);font-weight:700;text-decoration:underline;min-height:32px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="signin" class="signin" hidden>
  <img src="icon-192.png" alt="">
  <h1>Cal Pro Tracker</h1>
  <p class="note">Sign in to keep your log in sync.</p>
  <button class="primary" id="gBtn" style="height:48px;border-radius:12px;font-weight:600;width:100%">Sign in with Google</button>
  <details>
    <summary class="small" style="cursor:pointer">Use email and password instead</summary>
    <form id="emailForm" style="margin-top:10px">
      <input id="em" type="email" autocomplete="email" placeholder="you@example.com">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
      <button class="secondary" style="height:46px;border-radius:12px;font-weight:600">Sign in</button>
    </form>
  </details>
  <div class="err" id="signErr" hidden></div>
</div>

<main id="app" hidden>
  <header class="top">
    <div class="daynav">
      <button class="navbtn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="min-width:0"><h1 style="margin:0"><button class="daytitle" id="dayTitle" aria-label="Choose a date">Today</button></h1><p id="daySub">Day runs 1am to 1am</p></div>
      <button class="navbtn off" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <div class="summary">
    <div>
      <div class="meter-head"><span class="meter-label">Calories · limit</span><span class="status num" id="kStatus"></span></div>
      <div><span class="big num" id="kNow">0</span><span class="of num" id="kOf"></span></div>
      <div class="track"><div class="fill" id="kFill"></div></div>
    </div>
    <div>
      <div class="meter-head"><span class="meter-label">Protein · minimum</span><span class="status num" id="pStatus"></span></div>
      <div><span class="big num" id="pNow">0</span><span class="of num" id="pOf"></span></div>
      <div class="track"><div class="fill" id="pFill"></div></div>
    </div>
  </div>

  <section id="quickSec" hidden>
    <h2>Quick add <small>tap to log · hold to remove</small></h2>
    <div class="chips" id="chips"></div>
  </section>

  <section>
    <h2><span>Entries <small id="todayCount"></small></span><button class="linkbtn" id="copyBtn" hidden>Copy items to today</button></h2>
    <div class="list" id="todayList"><div class="empty">Loading your log…</div></div>
  </section>

  <section>
    <h2>History <span class="seg" id="rangeSeg"><button data-r="7">7 days</button><button data-r="30">30 days</button></span></h2>
    <div class="week">
      <div class="avg" id="avg"></div>
      <div class="bars" id="bars"></div>
      <div class="blabels" id="blabels"></div>
      <div class="hint" id="histHint"></div>
    </div>
  </section>
</main>

<div class="addbar" id="addbar" hidden>
  <div class="in">
    <div class="suggest" id="suggest" hidden></div>
    <div class="addlabel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addLabel">Add food</span></div>
    <div class="r1">
      <input id="desc" placeholder="Tesco chicken wrap" autocomplete="off" enterkeyhint="done">
      <button class="iconbtn" id="scanBtn" aria-label="Scan a barcode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>
      </button>
      <button class="iconbtn" id="photoBtn" aria-label="Photo of food or label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="iconbtn" id="presetBtn" aria-label="Presets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"/></svg>
      </button>
    </div>
    <div class="r2">
      <input id="kIn" inputmode="numeric" placeholder="kcal" aria-label="Calories" autocomplete="off">
      <input id="pIn" inputmode="decimal" placeholder="protein g" aria-label="Protein grams" autocomplete="off">
      <button class="addbtn" id="addBtn">Add</button>
    </div>
    <div class="err" id="addErr" hidden></div>
  </div>
</div>

<input type="file" id="camFile" accept="image/*" capture="environment" hidden>
<input type="file" id="galFile" accept="image/*" hidden>
<div id="scrim" hidden></div>
<section id="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div class="sb" id="sheetBody"></div></section>
<div id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase config: rwapps1-hub project (same as your other tools) ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAYf97LVA839hP-jUpbwQJ7JgftMvdwKLQ",

  projectId: "rwapps1-hub",

};
/* ================================================================================================ */

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('en-GB');
const fmtP=n=>{const r=Math.round((n||0)*10)/10;return Number.isInteger(r)?String(r):r.toFixed(1)};
const num=v=>{v=String(v??'').trim().replace(',','.');if(v==='')return null;const n=Number(v);return isFinite(n)&&n>=0?n:null};
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
function fetchT(url,opts={},ms=15000){const ac=new AbortController(),t=setTimeout(()=>ac.abort('timeout'),ms);
  if(opts.signal){if(opts.signal.aborted)ac.abort();else opts.signal.addEventListener('abort',()=>ac.abort())}
  return fetch(url,{...opts,signal:ac.signal}).catch(e=>{if(opts.signal&&opts.signal.aborted)throw e;throw{code:ac.signal.aborted?'timeout':'network',message:String(e&&e.message||e)}}).finally(()=>clearTimeout(t))}
window.addEventListener('error',e=>{try{toast('App error: '+(e.message||'unknown'))}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{const r=e.reason;toast('App error: '+(r&&(r.message||r.code)||r))}catch(_){}});
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function dayKey(ts){const d=new Date(ts-3600000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function keyDate(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDays(k,n){const d=keyDate(k);d.setDate(d.getDate()+n);return dayKey(d.getTime()+3600000)}
const dayLabel=(k,o)=>keyDate(k).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const timeLabel=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

const QTYS=[.5,1,1.5,2,3,4,5];
const fmtQ=q=>q===.5?'½':q===1.5?'1½':String(+q);
const r1=n=>Math.round((+n||0)*10)/10;
const qtyOf=e=>+e.qty||1;
const eachK=e=>e.kcalEach!=null?+e.kcalEach:(+e.kcal||0)/qtyOf(e);
const eachP=e=>e.proteinEach!=null?+e.proteinEach:(+e.protein||0)/qtyOf(e);
const dispName=e=>e.name+(qtyOf(e)!==1?' ×'+fmtQ(qtyOf(e)):'');
const S={view:dayKey(Date.now()),range:+lsGet('calpro.range')||7,subFrom:null,all:null,allLoading:false,base:null,hidden:[],entries:[],presets:[],settings:{kcal:2400,protein:180},today:dayKey(Date.now()),sel:null,ready:false,unsub:[],entUnsub:null};
const SRC={typed:'typed',estimate:'estimated',photo:'photo',barcode:'barcode',search:'food database',preset:'preset',quick:'quick add'};

/* ===== Firebase ===== */
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(), db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

auth.onAuthStateChanged(u=>{
  S.unsub.forEach(f=>f());S.unsub=[];if(S.entUnsub){S.entUnsub();S.entUnsub=null}S.subFrom=null;S.all=null;
  if(!u){$('#signin').hidden=false;$('#app').hidden=true;$('#addbar').hidden=true;return}
  $('#signin').hidden=true;$('#app').hidden=false;$('#addbar').hidden=false;
  S.base=db.collection('calpro').doc(u.uid);
  S.unsub.push(S.base.onSnapshot(s=>{const d=s.data()||{};if(d.settings&&d.settings.kcal)S.settings={kcal:+d.settings.kcal,protein:+d.settings.protein};S.hidden=Array.isArray(d.hiddenChips)?d.hiddenChips:[];render()},()=>{}));
  S.unsub.push(S.base.collection('presets').onSnapshot(s=>{S.presets=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
  subscribe();
  if(!lsGet('calpro.gemkey'))banner('Add your free Gemini key in Settings to read photos and estimate food. <button id="bKey">Open Settings</button>',()=>$('#bKey').onclick=settingsSheet);
});
$('#gBtn').onclick=async()=>{signErr('');const p=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(p)}catch(e){if(/popup/.test(e.code||''))auth.signInWithRedirect(p);else signErr(authMsg(e))}};
$('#emailForm').onsubmit=async e=>{e.preventDefault();signErr('');try{await auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value)}catch(err){signErr(authMsg(err))}};
function authMsg(e){const c=e&&e.code||'';if(/wrong-password|invalid-credential|user-not-found/.test(c))return 'Email or password is wrong.';if(/unauthorized-domain/.test(c))return 'This web address isn’t approved in Firebase. Add it under Authentication > Settings > Authorised domains.';if(/network/.test(c))return 'No connection. Try again when you’re online.';return 'Sign-in failed ('+c+').'}
function signErr(m){$('#signErr').textContent=m;$('#signErr').hidden=!m}

function subscribe(force){
  const from=[addDays(S.today,-29),S.view].sort()[0];
  if(!force&&S.entUnsub&&from===S.subFrom)return;
  S.subFrom=from;if(S.entUnsub)S.entUnsub();
  S.entUnsub=S.base.collection('entries').where('day','>=',from).onSnapshot(snap=>{
    S.ready=true;S.entries=snap.docs.map(d=>({id:d.id,...d.data()}));render();updateSuggest()},
    err=>banner('Your log could not load ('+esc(err.code||'error')+'). Check the Firestore rules.'));
}
/* builds an entry; kcal/protein are totals, kcalEach/proteinEach are for 1 item */
function entryDoc(e,day){
  const q=+e.qty||1,ke=e.kcalEach!=null?+e.kcalEach:(+e.kcal||0)/q,pe=e.proteinEach!=null?+e.proteinEach:(+e.protein||0)/q;
  let ts=Date.now();if(day!==S.today){const n=new Date(),d=keyDate(day);d.setHours(n.getHours(),n.getMinutes(),n.getSeconds());ts=d.getTime()}
  return{day,ts,name:(e.name||'Entry').slice(0,80),qty:q,kcalEach:r1(ke),proteinEach:r1(pe),kcal:Math.round(ke*q),protein:r1(pe*q),src:e.src||'typed'};
}
function addEntry(e,msg){
  if(!S.base)return;
  const day=e.day||S.view,ref=S.base.collection('entries').doc(),d=entryDoc(e,day);
  ref.set(d).catch(()=>toast('Could not save that entry.'));
  if(S.all)S.all.push({id:ref.id,...d});
  toast(msg||('Added '+dispName(d)+(day===S.today?'':' to '+dayLabel(day))),()=>{ref.delete();if(S.all)S.all=S.all.filter(x=>x.id!==ref.id)});
}
function savePreset(p,id){
  const d={name:(p.name||'Preset').slice(0,60),kcal:Math.round(+p.kcal||0),protein:Math.round((+p.protein||0)*10)/10};
  const c=S.base.collection('presets');(id?c.doc(id).update(d):c.add({...d,uses:0,lastUsed:0})).catch(()=>toast('Could not save preset.'));
}
const fromPreset=p=>({name:p.name,kcalEach:+p.kcal||0,proteinEach:+p.protein||0,presetId:p.id,src:'preset'});

/* day chips used by the amount picker and Move */
function dayChoices(day){const t=S.today,y=addDays(t,-1),l=[[t,'Today'],[y,'Yesterday']];if(day!==t&&day!==y)l.push([day,dayLabel(day)]);return l}
function mountDayPicker(b,get,set){
  const box=b.querySelector('#qd'),di=b.querySelector('#qDate');
  const draw=()=>{const day=get();box.innerHTML=dayChoices(day).map(([k,l])=>`<button class="qo" data-d="${k}">${esc(l)}</button>`).join('')+'<button class="qo" data-d="pick">Pick a date…</button>';
    box.querySelectorAll('.qo').forEach(x=>x.classList.toggle('on',x.dataset.d===day))};
  box.onclick=e=>{const x=e.target.closest('[data-d]');if(!x)return;
    if(x.dataset.d==='pick'){di.hidden=false;di.max=S.today;di.value=get();try{di.showPicker()}catch(_){di.focus()}return}
    di.hidden=true;set(x.dataset.d);draw()};
  di.onchange=()=>{const v=di.value;if(v&&v<=S.today){set(v);di.hidden=true;draw()}};
  draw();return draw;
}
const dayPickerHTML='<div><div class="kicker" style="margin-bottom:6px">Day</div><div class="qopts" id="qd"></div><input type="date" id="qDate" hidden style="margin-top:8px"></div>';
const qtyHTML=(id,label)=>`<div><div class="kicker" style="margin-bottom:6px">${label||'How many?'}</div><div class="qopts" id="${id}">${QTYS.map(x=>`<button class="qo" data-q="${x}">${fmtQ(x)}</button>`).join('')}</div></div>`;
function mountQty(b,id,get,set){const box=b.querySelector('#'+id);const draw=()=>box.querySelectorAll('.qo').forEach(x=>x.classList.toggle('on',+x.dataset.q===get()));
  box.onclick=e=>{const x=e.target.closest('[data-q]');if(x){set(+x.dataset.q);draw()}};draw()}

/* "How many?" picker: it = {name,kcalEach,proteinEach,presetId?,src} */
function qtySheet(it,o={}){
  let qty=o.qty||1,day=o.day||S.view;
  openSheet(`${head(esc(it.name),o.kicker||'Add')}
    <div class="note num">1 item = ${fmtP(it.kcalEach)} kcal · ${fmtP(it.proteinEach)} g protein</div>
    ${qtyHTML('qq')}${dayPickerHTML}
    <div class="actions"><button class="secondary" data-close>Cancel</button><button class="primary" id="qAdd"></button></div>`,
  b=>{const btn=b.querySelector('#qAdd');
    const label=()=>{btn.textContent=`Add ${fmt(it.kcalEach*qty)} kcal · ${fmtP(it.proteinEach*qty)} g`};
    mountQty(b,'qq',()=>qty,v=>{qty=v;label()});mountDayPicker(b,()=>day,v=>{day=v});label();
    btn.onclick=()=>{addEntry({name:it.name,kcalEach:it.kcalEach,proteinEach:it.proteinEach,qty,day,src:it.src||'quick'});
      if(it.presetId){const p=S.presets.find(x=>x.id===it.presetId);if(p)S.base.collection('presets').doc(p.id).update({uses:(p.uses||0)+1,lastUsed:Date.now()}).catch(()=>{})}
      closeSheet()}});
}

/* ===== day navigation ===== */
function setView(k,top){if(k>S.today)k=S.today;S.view=k;subscribe();render();if(top)window.scrollTo({top:0,behavior:'smooth'})}
function goToSheet(){
  openSheet(`${head('Go to a date')}<input type="date" id="gDate" max="${S.today}" value="${S.view}">
    <div class="actions"><button class="secondary" id="gY">Yesterday</button><button class="primary" id="gT">Today</button></div>`,
  b=>{const di=b.querySelector('#gDate');di.onchange=()=>{if(di.value&&di.value<=S.today){closeSheet();setView(di.value)}};
    b.querySelector('#gY').onclick=()=>{closeSheet();setView(addDays(S.today,-1))};b.querySelector('#gT').onclick=()=>{closeSheet();setView(S.today)};
    try{di.showPicker()}catch(_){}});
}

/* ===== copy several items ===== */
function copySheet(){
  const list=dayEntries(S.view);if(!list.length)return;
  openSheet(`${head('Copy items to today',dayLabel(S.view,{weekday:'long',day:'numeric',month:'short'}))}
    <div class="list">${list.map((e,i)=>`<label class="ckrow"><input type="checkbox" data-c="${i}"><span class="nm">${esc(dispName(e))}</span><span class="small num">${fmt(e.kcal)} kcal · ${fmtP(e.protein)} g</span></label>`).join('')}</div>
    <div class="actions"><button class="secondary" data-close>Cancel</button><button class="primary" id="cGo">Tick items to copy</button></div>`,
  b=>{const go=b.querySelector('#cGo'),picked=()=>[...b.querySelectorAll('[data-c]:checked')].map(x=>list[+x.dataset.c]);
    const label=()=>{const n=picked().length;go.textContent=n?`Add ${n} ${n===1?'item':'items'} to today`:'Tick items to copy'};
    b.querySelectorAll('[data-c]').forEach(x=>x.onchange=label);
    go.onclick=()=>{const sel=picked();if(!sel.length)return;const batch=db.batch(),refs=[];
      for(const e of sel){const ref=S.base.collection('entries').doc();refs.push(ref);const d=entryDoc({name:e.name,kcalEach:eachK(e),proteinEach:eachP(e),qty:qtyOf(e),src:e.src},S.today);batch.set(ref,d);if(S.all)S.all.push({id:ref.id,...d})}
      batch.commit().catch(()=>toast('Could not copy those items.'));closeSheet();
      toast(`Added ${sel.length} ${sel.length===1?'item':'items'} to today`,()=>{const u=db.batch();refs.forEach(r=>u.delete(r));u.commit().catch(()=>{})})}});
}

/* ===== search past items as you type ===== */
function loadAll(){if(S.all||S.allLoading||!S.base)return;S.allLoading=true;
  S.base.collection('entries').get().then(s=>{S.all=s.docs.map(d=>({id:d.id,...d.data()}));S.allLoading=false;updateSuggest()}).catch(()=>{S.allLoading=false})}
const stem=w=>w.length>4?w.replace(/ies$/,'y').replace(/(es|s|ed|ing)$/,''):w;
const toks=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(w=>w.length>1).map(stem);
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let prev=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[b.length]}
function tokMatch(q,t){if(t.startsWith(q))return 4;if(q.length>=3&&t.includes(q))return 3;if(t.length>=3&&q.startsWith(t))return 3;if(q.length>=4&&lev(q,t)<=(q.length>=7?2:1))return 2;return 0}
function searchItems(text){
  const qt=toks(text);if(!qt.length)return[];
  const items=new Map();
  const ents=new Map();for(const e of S.all||[])ents.set(e.id,e);for(const e of S.entries)ents.set(e.id,e);
  for(const e of ents.values()){const k=e.name.toLowerCase(),it=items.get(k);
    if(!it)items.set(k,{name:e.name,kcalEach:eachK(e),proteinEach:eachP(e),ts:e.ts,day:e.day,count:1,src:'quick'});
    else{it.count++;if(e.ts>it.ts){it.ts=e.ts;it.day=e.day;it.kcalEach=eachK(e);it.proteinEach=eachP(e);it.name=e.name}}}
  for(const p of S.presets){const k=p.name.toLowerCase(),it=items.get(k)||{ts:0,count:0};
    items.set(k,{...it,name:p.name,kcalEach:+p.kcal||0,proteinEach:+p.protein||0,presetId:p.id,src:'preset'})}
  const out=[];
  for(const it of items.values()){const nt=toks(it.name);let sc=0,hit=0;
    for(const q of qt){let best=0;for(const t of nt)best=Math.max(best,tokMatch(q,t));if(best)hit++;sc+=best}
    if(hit)out.push({it,all:hit===qt.length,sc})}
  out.sort((a,b)=>(b.all-a.all)||(b.sc-a.sc)||(!!b.it.presetId-!!a.it.presetId)||(b.it.count-a.it.count)||(b.it.ts-a.it.ts));
  return out.slice(0,6).map(x=>x.it);
}
function updateSuggest(){
  const box=$('#suggest');if(!box)return;const text=$('#desc').value.trim();
  if(text.length<2){box.hidden=true;S.sug=[];return}
  loadAll();S.sug=searchItems(text);
  if(!S.sug.length){box.hidden=!S.allLoading;box.innerHTML='<div class="sgh">Searching your past items…</div>';return}
  const when=it=>it.day?'last '+(it.day===S.today?'today':it.day===addDays(S.today,-1)?'yesterday':dayLabel(it.day,{day:'numeric',month:'short'})):'';
  box.innerHTML='<div class="sgh">Your past items and presets · per item</div>'+S.sug.map((it,i)=>`<button class="row" data-s="${i}"><div style="min-width:0"><div class="nm">${esc(it.name)}${it.presetId?'<span class="badge">preset</span>':''}</div><div class="meta">${[when(it),it.count>1?it.count+' times':''].filter(Boolean).join(' · ')}</div></div><div class="vals num"><b>${fmt(it.kcalEach)} kcal</b><span>${fmtP(it.proteinEach)} g</span></div></button>`).join('');
  box.hidden=false;
}

/* ===== rendering ===== */
function totals(day){let k=0,p=0;for(const e of S.entries)if(e.day===day){k+=+e.kcal||0;p+=+e.protein||0}return{k,p}}
function dayEntries(day){return S.entries.filter(e=>e.day===day).sort((a,b)=>b.ts-a.ts)}
function rowHTML(e){return `<button class="row" data-id="${esc(e.id)}"><div style="min-width:0"><div class="nm">${esc(dispName(e))}</div><div class="meta">${timeLabel(e.ts)} · ${SRC[e.src]||esc(e.src)}</div></div><div class="vals num"><b>${fmt(e.kcal)} kcal</b><span>${fmtP(e.protein)} g</span></div></button>`}
function render(){
  const v=S.view,isT=v===S.today,st=S.settings,{k,p}=totals(v);
  $('#dayTitle').textContent=dayLabel(v,{weekday:'long',day:'numeric',month:'short'});
  $('#daySub').innerHTML=isT?'Day runs 1am to 1am':'<button class="linkbtn" id="toToday">Back to today</button>';
  $('#nextDay').classList.toggle('off',isT);
  $('#addLabel').textContent=isT?'Add food':'Add food to '+dayLabel(v);
  $('#kNow').textContent=fmt(k);$('#kOf').textContent='/ '+fmt(st.kcal)+' kcal';
  $('#pNow').textContent=fmtP(p);$('#pOf').textContent='/ '+fmt(st.protein)+' g';
  const kr=st.kcal?k/st.kcal:0,kf=$('#kFill'),ks=$('#kStatus');kf.style.width=Math.min(100,kr*100)+'%';
  if(k>st.kcal){kf.style.background='var(--over)';ks.textContent=fmt(k-st.kcal)+' over';ks.style.cssText='background:var(--over-soft);color:var(--over)'}
  else{kf.style.background=kr>=.9?'var(--over)':'var(--kcal)';ks.textContent=fmt(st.kcal-k)+' left';ks.style.cssText='background:var(--kcal-soft);color:var(--kcal)'}
  const pr=st.protein?p/st.protein:0,pf=$('#pFill'),ps=$('#pStatus');pf.style.width=Math.min(100,pr*100)+'%';pf.style.background='var(--pro)';
  if(p>=st.protein){ps.textContent='Target hit'+(p>st.protein?' +'+fmtP(p-st.protein)+' g':'');ps.style.cssText='background:var(--pro);color:var(--surface)'}
  else{ps.textContent=fmtP(st.protein-p)+' g to go';ps.style.cssText='background:var(--pro-soft);color:var(--pro)'}
  const list=dayEntries(v);
  $('#todayCount').textContent=list.length?list.length+(list.length===1?' item':' items'):'';
  $('#copyBtn').hidden=isT||!list.length;
  $('#todayList').innerHTML=!S.ready?'<div class="empty">Loading your log…</div>':list.length?list.map(rowHTML).join(''):
    (isT?'<div class="empty">Nothing logged yet today. Scan a barcode, snap a photo, type what you had, or pick a preset.</div>':'<div class="empty">Nothing logged on this day. Anything you add with the bar below goes on this day.</div>');
  renderChips();renderWeek();
}
function renderChips(){
  const hid=new Set(S.hidden);
  const used=[...S.presets].filter(p=>!hid.has(p.name.toLowerCase())).sort((a,b)=>(b.lastUsed||0)-(a.lastUsed||0)||(b.uses||0)-(a.uses||0)).slice(0,5).map(fromPreset);
  const names=new Set([...used.map(u=>u.name.toLowerCase()),...hid]),recent=[];
  for(const e of [...S.entries].sort((a,b)=>b.ts-a.ts)){const n=e.name.toLowerCase();if(!names.has(n)){names.add(n);recent.push({name:e.name,kcalEach:eachK(e),proteinEach:eachP(e),src:'quick'})}if(recent.length>=4)break}
  S.chips=[...used,...recent];$('#quickSec').hidden=!S.chips.length;
  $('#chips').innerHTML=S.chips.map((c,i)=>`<button class="chip" data-i="${i}">+ ${esc(c.name)}<em class="num">${fmt(c.kcalEach)}</em></button>`).join('');
}
/* press and hold a Quick add chip */
let holdT=null,holdFired=false,holdXY=null;
function chipMenu(c){
  openSheet(`${head(esc(c.name),'Quick add')}<div class="note num">1 item = ${fmtP(c.kcalEach)} kcal · ${fmtP(c.proteinEach)} g protein${c.presetId?' · preset':''}</div>
    <div class="actions"><button class="secondary" id="cAdd">Add</button><button class="danger" id="cHide">Remove from Quick add</button></div>
    <div class="small">${c.presetId?'The preset stays in your presets list.':'Your logged entries aren’t changed.'} Hidden items can be restored in Settings.</div>`,
  b=>{b.querySelector('#cAdd').onclick=()=>qtySheet(c);
    b.querySelector('#cHide').onclick=()=>{const n=c.name.toLowerCase();if(!S.hidden.includes(n)){S.hidden=[...S.hidden,n];render();
      S.base.set({hiddenChips:firebase.firestore.FieldValue.arrayUnion(n)},{merge:true}).catch(()=>toast('Could not save that change.'))}
      closeSheet();toast('Removed from Quick add',()=>{S.hidden=S.hidden.filter(x=>x!==n);render();S.base.set({hiddenChips:firebase.firestore.FieldValue.arrayRemove(n)},{merge:true}).catch(()=>{})})}});
}
const chipsEl=document.getElementById('chips');
chipsEl.addEventListener('pointerdown',e=>{const ch=e.target.closest('.chip[data-i]');if(!ch)return;holdFired=false;holdXY=[e.clientX,e.clientY];clearTimeout(holdT);
  holdT=setTimeout(()=>{holdFired=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}const c=S.chips[+ch.dataset.i];if(c)chipMenu(c)},500)});
chipsEl.addEventListener('pointermove',e=>{if(holdXY&&Math.hypot(e.clientX-holdXY[0],e.clientY-holdXY[1])>10)clearTimeout(holdT)});
['pointerup','pointercancel','pointerleave'].forEach(t=>chipsEl.addEventListener(t,()=>clearTimeout(holdT)));
chipsEl.addEventListener('contextmenu',e=>{if(e.target.closest('.chip'))e.preventDefault()});
function renderWeek(){
  const st=S.settings,n=S.range===30?30:7,days=[];for(let i=n-1;i>=0;i--)days.push(addDays(S.today,-i));
  $('#rangeSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.r===n));
  const tots=days.map(totals),maxK=Math.max(st.kcal*1.15,...tots.map(t=>t.k),1);
  const done=tots.slice(0,n-1).filter(t=>t.k>0||t.p>0),hits=done.filter(t=>t.p>=st.protein).length,under=done.filter(t=>t.k<=st.kcal).length;
  $('#avg').innerHTML=done.length?`<div><b class="num" style="color:var(--kcal)">${fmt(done.reduce((s,t)=>s+t.k,0)/done.length)}</b> kcal avg</div><div><b class="num" style="color:var(--pro)">${fmtP(done.reduce((s,t)=>s+t.p,0)/done.length)}</b> g protein avg</div><div class="small" style="flex-basis:100%">Across ${done.length} logged ${done.length===1?'day':'days'} before today · under calorie limit on ${under} · protein hit on ${hits}</div>`
    :'<div class="note">Averages appear once you have a full day logged.</div>';
  const bars=$('#bars');bars.classList.toggle('b30',n===30);bars.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  bars.innerHTML=`<div class="tline" style="bottom:${st.kcal/maxK*100}%"></div>`+days.map((d,i)=>{const t=tots[i],c=['bar'];if(t.k>st.kcal)c.push('over');if(d===S.today)c.push('today');if(d===S.view&&d!==S.today)c.push('sel');
    return `<button class="${c.join(' ')}" data-day="${d}" aria-label="${dayLabel(d)}: ${fmt(t.k)} kcal, ${fmtP(t.p)} g protein"><i style="height:${t.k/maxK*100}%"></i></button>`}).join('');
  const bl=$('#blabels');bl.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;

const OFF_FIELDS='code,product_name,product_name_en,brands,quantity,product_quantity,product_quantity_unit,serving_size,nutriments';
function offToR(p,code){
  if(!p)return null;const n=p.nutriments||{};
  let k100=num(n['energy-kcal_100g']);if(k100==null&&num(n['energy_100g'])!=null)k100=n['energy_100g']/4.184;
  const p100=num(n['proteins_100g']);
  const unit=(String(p.product_quantity_unit||'').toLowerCase()==='ml'||/\d\s*(ml|cl|l)\b/i.test(p.quantity||''))?'ml':'g';
  const size=num(p.product_quantity);
  const per100=k100!=null?{unit,kcal:k100,protein:p100||0}:null;
  const sk=num(n['energy-kcal_serving']);
  const serving=sk!=null?{label:p.serving_size||'1 serving',kcal:sk,protein:num(n['proteins_serving'])||0}:null;
  if(!per100&&!serving)return null;
  const brand=String(p.brands||'').split(',')[0].trim(),pn=p.product_name_en||p.product_name||'';
  const name=(pn&&brand&&!pn.toLowerCase().includes(brand.toLowerCase())?brand+' '+pn:pn||brand||('Barcode '+(code||p.code)))+(p.quantity&&!/\d/.test(pn)?' '+p.quantity:'');
  return{type:'packaged',name:name.slice(0,70),pack:{size,unit,kcal:null,protein:null},per100,serving,confidence:'high',note:'From Open Food Facts'+(per100&&p100==null?' (no protein figure listed)':''),kicker:'Food database',src:'barcode',code:code||p.code};
}
async function offBarcode(code,signal){
  const r=await fetchT(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`,{signal},12000);
  if(r.status===404)return null;if(!r.ok)throw new Error('off '+r.status);
  const j=await r.json();return j.status===1||j.product?offToR(j.product,code):null;
}
async function offSearch(text,signal){
  const u=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(text)}&search_simple=1&action=process&json=1&page_size=20&sort_by=unique_scans_n&tagtype_0=countries&tag_contains_0=contains&tag_0=united-kingdom&fields=${OFF_FIELDS}`;
  const r=await fetchT(u,{signal},10000);if(!r.ok)throw new Error('off '+r.status);
  const j=await r.json();return(j.products||[]).map(p=>offToR(p,p.code)).filter(Boolean).slice(0,8);
}

/* ===== Gemini (free key, stored on this device only) ===== */
const GEM_ERR={503:'Gemini is busy right now (all models tried). Try again in a minute or enter the numbers yourself.',500:'Gemini had a problem on its side. Try again in a minute.',timeout:'Gemini took too long to answer. Try again.',network:'Gemini couldn’t be reached. Check your connection.',nokey:'Add your free Gemini key in Settings to use estimates and photo reading.',429:'You’ve hit Gemini’s free limit for now. Try again later or enter the numbers yourself.',400:'Gemini rejected the request. Check the key and model in Settings.',403:'Gemini refused the key. Check it in Settings.',404:'That Gemini model wasn’t found. Check the model name in Settings.'};
function parseJSON(t){t=String(t||'').replace(/```(?:json)?/gi,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw{code:'json'};return JSON.parse(t.slice(a,b+1))}
const FALLBACK_MODELS=['gemini-flash-latest','gemini-2.5-flash','gemini-flash-lite-latest','gemini-2.5-flash-lite','gemini-2.0-flash'];
/* models that ran out of free allowance are skipped until Google's reset (midnight Pacific time) */
function msToPacificMidnight(){try{const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(new Date());
  const g=t=>+f.find(x=>x.type===t).value;return((24-g('hour'))*3600-g('minute')*60-g('second'))*1000+60000}catch(e){return 6*3600000}}
function spentMap(){try{return JSON.parse(lsGet('calpro.spent')||'{}')}catch(e){return{}}}
function isSpent(k){const m=spentMap();return m[k]&&m[k]>Date.now()}
function markSpent(k,e){const daily=/PerDay|per day|daily/i.test(String(e&&e.details||'')+String(e&&e.message||''));const m=spentMap();
  m[k]=Date.now()+(daily?msToPacificMidnight():60000);for(const x in m)if(m[x]<=Date.now())delete m[x];lsSet('calpro.spent',JSON.stringify(m))}
function spentList(){const m=spentMap(),now=Date.now();return Object.keys(m).filter(k=>m[k]>now).map(k=>k+' (until '+new Date(m[k]).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+')')}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geminiOnce(model,key,body,signal,ms=30000){
  const res=await fetchT(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal},ms);
  if(!res.ok){const j=await res.json().catch(()=>({}));throw{code:res.status,message:j.error&&j.error.message,details:JSON.stringify(j.error&&j.error.details||'')}}
  const j=await res.json();const text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');
  return parseJSON(text);
}
/* Tries your chosen model, retries once if Google says it's busy, then falls back to other models. */
async function gemini(parts,{search=false,signal}={}){
  const key=lsGet('calpro.gemkey');if(!key)throw{code:'nokey'};
  const mine=lsGet('calpro.model')||'gemini-flash-latest';
  const body={contents:[{role:'user',parts}],generationConfig:{temperature:0.2}};
  if(search)body.tools=[{google_search:{}}];else body.generationConfig.responseMimeType='application/json';
  if(search){
    const sm=[mine,...FALLBACK_MODELS.filter(m=>m!==mine)].filter(m=>!isSpent(m)&&!isSpent(m+':search'));let lastS={code:429,message:'Every model’s free Google Search allowance is used up until Google resets it.'};
    for(const m of sm){setBusy('Searching Google for published figures'+(m===mine?'':' (trying '+m+')')+'…');
      try{return await geminiOnce(m,key,body,signal,20000)}
      catch(e){lastS=e;if(signal&&signal.aborted)throw e;if(e.code===429){markSpent(m+':search',e);continue}if(e.code===404||e.code===503||e.code===500||e.code==='timeout')continue;throw e}}
    throw lastS}
  const models=[mine,...FALLBACK_MODELS.filter(m=>m!==mine)].filter(m=>!isSpent(m));
  let last={code:429,message:'Every Gemini model’s free allowance is used up until Google resets it.'};
  for(const m of models){
    for(let attempt=0;attempt<2;attempt++){
      setBusy(attempt?'Gemini busy, retrying '+m+'…':(m===mine?'Asking Gemini…':'Gemini busy, trying backup model '+m+'…'));
      try{return await geminiOnce(m,key,body,signal)}
      catch(e){last=e;if(signal&&signal.aborted)throw e;
        const busy=e.code===503||e.code===500||e.code==='timeout';
        if(busy&&attempt===0){await sleep(1500);continue}
        if(e.code===429){markSpent(m,e);break}
        if(busy||e.code===404)break;
        throw e}
    }
  }
  throw last;
}
function gemFail(e,kicker,fallback){
  const msg=GEM_ERR[e&&e.code]||(e&&e.code==='json'?'Gemini’s answer couldn’t be read. Try again.':'Couldn’t get an estimate'+(navigator.onLine?'':' while offline')+'. Try again or enter the numbers yourself.');
  const det=e&&(e.code!=null||e.message)?`<div class="small">Details: ${esc(String(e.code??''))} ${esc(String(e.message||'').slice(0,300))}</div>`:'';
  openSheet(`${head('No estimate',kicker)}<div class="note">${esc(msg)}</div>${det}<div class="actions"><button class="secondary" data-close>Close</button><button class="primary" id="manual">Enter manually</button></div>`,
    b=>b.querySelector('#manual').onclick=()=>review({...fallback,type:'manual',kicker:'Manual entry'}));

const JSON_RULES='Reply with only one JSON object and no other text. Numbers are plain numbers without units. Protein in grams to at most 1 decimal place; calories as whole kcal.';

async function estimateText(text,k,p){
  const ac=new AbortController();busy('Estimating…','Typed entry',()=>ac.abort());

Food eaten: "${text}"
${k!=null?`The user says this was ${k} kcal. Use exactly that.\n`:''}${p!=null?`The user says this had ${p} g protein. Use exactly that.\n`:''}If it names a brand, chain or restaurant dish, use its published nutrition (search for it if you can). Otherwise assume typical UK portions and products. If amounts are given, use them.

  const ac=new AbortController();busy('Reading your photo…','Photo',()=>ac.abort());
  setBusy('Preparing photo…');const img=await prepImage(file);if(ac.signal.aborted)return;
  setBusy('Checking for a barcode…');const code=await decodeImage(img);if(ac.signal.aborted)return;
  let missing='';
  if(code){setBusy('Looking up barcode '+code+'…');try{const r=await offBarcode(code,ac.signal);if(ac.signal.aborted)return;if(r){onClose=null;review(r);return}missing=code}catch(e){if(ac.signal.aborted)return}}
  const prompt=`You help a UK adult log calories (kcal) and protein (g). The photo shows one of: a product barcode, food packaging (front of pack or nutrition label), or a plate or bowl of food.${note?`\nThe user added: "${note}". Take any amount they mention into account.`:''}${missing?`\nIts barcode (${missing}) is not in Open Food Facts.`:''}
Rules:
- If a nutrition label is readable, copy its figures (UK labels show per 100g/100ml and often per pack or serving).
- If only the front of pack is visible, identify the product (brand, name, pack size) and use its typical published UK values with confidence "medium" or "low". If you cannot identify it, set type "unclear" and say in note what photo would help.
- For a plate, identify each component, estimate portion sizes from visual cues and total them.
Return JSON: {"type": "packaged"|"plate"|"unclear", "name": short tidy name (max 40 chars), "search": for packaged products, the brand and product name to search a food database with (e.g. "Ron Miel honey rum"), else null, "fromLabel": true if you read the figures from a visible nutrition label, else false, "pack": {"size": number|null, "unit": "g"|"ml"|null, "kcal": number|null, "protein": number|null}, "per100": {"unit": "g"|"ml", "kcal": number, "protein": number} or null, "serving": {"label": short label like "1 bar", "kcal": number, "protein": number} or null, "items": [{"name": string, "kcal": number, "protein": number}] for plates, otherwise [], "kcal": best estimate of what was eaten (whole pack or plate unless the user said otherwise), "protein": number, "confidence": "high"|"medium"|"low", "note": one short sentence on what you read or assumed}
${JSON_RULES}`;
  let r;
  try{r=await gemini([{text:prompt},{inline_data:{mime_type:img.type||'image/jpeg',data:await b64(img)}}],{signal:ac.signal})}
  catch(e){if(ac.signal.aborted)return;onClose=null;gemFail(e,'Photo',{name:note||'',src:'photo'});return}
  if(ac.signal.aborted)return;onClose=null;
  if(r.type==='unclear'&&num(r.kcal)==null){
    openSheet(`${head('Couldn’t work that out','Photo')}<div class="note">${esc(r.note||'Try a photo of the nutrition label or the whole plate.')}</div><div class="actions"><button class="secondary" data-close>Close</button><button class="primary" id="again">Take another</button></div>`,
      b=>b.querySelector('#again').onclick=()=>{closeSheet();setTimeout(()=>$('#camFile').click(),150)});return}
  const est={...r,kicker:r.type==='plate'?'Plate estimate':'Packaged food',src:'photo'};
  if(r.type==='packaged'&&!r.fromLabel&&(r.search||r.name)){
    est.online=r.search||r.name;
    let cancelled=false;busy('Finding the exact product…','Photo',()=>{cancelled=true});setBusy('Checking Open Food Facts for '+est.online+'…');
    let list=[];try{list=await offSearch(est.online)}catch(e){}
    if(cancelled)return;onClose=null;
    if(list.length){showMatches('Is it one of these?','Food database',list,'None of these, search online',()=>onlineThenReview(est));return}
    onlineThenReview(est);return;
  }
  review(est);
}
/* tries published figures online; falls back to Gemini's estimate with a note saying so */
async function onlineThenReview(est){
  let cancelled=false;busy('Finding the exact product…','Photo',()=>{cancelled=true});
  try{const r=await fetchOnline(est.online);if(cancelled)return;onClose=null;
    if(r&&r.confidence==='high'&&(num(r.kcal)!=null||r.per100||r.serving)){review({...r,type:'packaged',kicker:'Published figures',src:'search'});return}
    review({...est,online:null,note:(est.note?est.note+' ':'')+'No published figures found online, so these are typical values.'})}
  catch(e){if(cancelled)return;onClose=null;
    const why=e&&e.code===429?'Online search is over Gemini’s free limit right now':'Online search didn’t work this time';
    review({...est,note:(est.note?est.note+' ':'')+why+', so these are typical values.'})}
}
/* look up a specific product's published figures with Google Search */
function fetchOnline(name,signal){
  const prompt=`Find the published nutrition for this UK product: "${name}". Search for the manufacturer's or a UK retailer's nutrition information.
Return JSON: {"type": "packaged", "name": short tidy name (max 40 chars), "pack": {"size": number|null, "unit": "g"|"ml"|null, "kcal": number|null, "protein": number|null}, "per100": {"unit": "g"|"ml", "kcal": number, "protein": number} or null, "serving": {"label": short label, "kcal": number, "protein": number} or null, "kcal": number for a typical serving, "protein": number, "confidence": "high" if taken from a published source, else "low", "note": one short sentence naming the source}
${JSON_RULES}`;
  return gemini([{text:prompt}],{search:true,signal});
}
async function lookupOnline(name){
  const ac=new AbortController();busy('Searching online…',name,()=>ac.abort());
  let r;try{r=await fetchOnline(name,ac.signal)}
  catch(e){if(ac.signal.aborted)return;onClose=null;gemFail(e,'Online lookup',{name,src:'photo'});return}
  if(ac.signal.aborted)return;onClose=null;
  review({...r,type:'packaged',kicker:'Published figures',src:'search'});
}
function showMatches(title,kicker,list,otherLabel,otherFn){
  const opt=r=>{const pk=r.per100&&r.pack.size?r.per100.kcal*r.pack.size/100:null;return pk!=null?fmt(pk)+' kcal/pack':r.serving?fmt(r.serving.kcal)+' kcal/serving':fmt(r.per100.kcal)+' kcal/100'+r.per100.unit};
  openSheet(`${head(title,kicker)}<div class="list">${list.map((r,i)=>`<button class="row" data-m="${i}"><div class="nm" style="min-width:0">${esc(r.name)}</div><div class="vals small num" style="color:var(--muted)">${opt(r)}</div></button>`).join('')}
    <button class="row" id="est"><span class="nm" style="color:var(--pro)">${esc(otherLabel)}</span><span aria-hidden="true">›</span></button></div>`,
  b=>{b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>review({...list[+x.dataset.m],src:'search'}));b.querySelector('#est').onclick=otherFn});
}
function photoSheet(){
  addErr('');
  openSheet(`${head('Add from a photo')}
    <label class="bigopt" for="camFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take a photo</label>
    <label class="bigopt" for="galFile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M20 15l-5-5-9 9"/></svg>Choose from gallery</label>
    <div class="small">Works with a barcode, a nutrition label, the front of a pack, or a plate of food. Anything typed in the box is sent as a note, like “ate half”.</div>`);
}
['#camFile','#galFile'].forEach(s=>{const el=$(s);el.addEventListener('click',()=>{el.value=''});el.onchange=()=>{const f=el.files&&el.files[0];if(!f)return;const note=$('#desc').value.trim();$('#desc').value='';
  analysePhoto(f,note)}});

/* typed name search */
async function nameSearch(text,k,p){
  const ac=new AbortController();busy('Searching…','Food database',()=>ac.abort());setBusy('Checking Open Food Facts…');
  let list=[];try{list=await offSearch(text,ac.signal)}catch(e){}
  if(ac.signal.aborted)return;onClose=null;
  if(!list.length){estimateText(text,k,p);return}
  showMatches('Matches for “'+text+'”','Food database',list,'None of these, estimate it',()=>estimateText(text,k,p));
}

/* ===== add bar ===== */
$('#addBtn').onclick=()=>{
  addErr('');const text=$('#desc').value.trim(),k=num($('#kIn').value),p=num($('#pIn').value);
  if(!text&&k==null&&p==null){addErr('Type what you had, or enter the numbers.');return}
  if(k!=null&&p!=null){addEntry({name:text||'Quick entry',kcal:k,protein:p,src:'typed'});clearBar();return}
  if(!text){addErr('Add a description so the missing number can be found, or fill in both numbers.');return}
  const pre=S.presets.find(x=>x.name.toLowerCase()===text.toLowerCase());
  if(pre&&k==null&&p==null){clearBar();qtySheet(fromPreset(pre));return}
  clearBar();$('#desc').blur();
  if(k==null&&p==null)nameSearch(text,k,p);else estimateText(text,k,p);
};
function clearBar(){$('#desc').value='';$('#kIn').value='';$('#pIn').value='';updateSuggest()}
$('#desc').addEventListener('input',updateSuggest);
$('#suggest').onclick=e=>{const x=e.target.closest('[data-s]');if(!x)return;const it=S.sug[+x.dataset.s];if(!it)return;clearBar();$('#desc').blur();qtySheet(it)};
$('#desc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#addBtn').click()}});
['#desc','#kIn','#pIn'].forEach(s=>$(s).addEventListener('input',()=>addErr('')));
$('#scanBtn').onclick=scanSheet;$('#photoBtn').onclick=photoSheet;$('#presetBtn').onclick=()=>{addErr('');presetsSheet()};$('#settingsBtn').onclick=settingsSheet;

/* ===== lists, edit, presets, settings ===== */
document.addEventListener('click',e=>{
  const row=e.target.closest('.row[data-id]');if(row&&!row.closest('#sheet')){editEntry(row.dataset.id);return}
  const chip=e.target.closest('.chip[data-i]');if(chip){if(holdFired){holdFired=false;return}const c=S.chips[+chip.dataset.i];if(!c)return;
    qtySheet(c);return}
  const bar=e.target.closest('.bar[data-day]');if(bar){setView(bar.dataset.day,true);return}
  if(e.target.closest('#toToday'))setView(S.today);
});
function editEntry(id){
  const en=S.entries.find(x=>x.id===id);if(!en)return;const ref=S.base.collection('entries').doc(id);let qty=qtyOf(en);
  openSheet(`${head('Edit entry',dayLabel(en.day)+' · '+timeLabel(en.ts))}
    <label class="f">Name<input id="eName" value="${esc(en.name)}"></label>
    <div class="fields"><label class="f">Calories per item<input id="eK" inputmode="decimal" value="${fmtP(eachK(en))}"></label><label class="f">Protein per item (g)<input id="eP" inputmode="decimal" value="${fmtP(eachP(en))}"></label></div>
    ${qtyHTML('eq')}
    <div class="note num" id="eTot"></div>
    <div class="actions"><button class="secondary" id="eDup">Add to today</button><button class="secondary" id="eMove">Move to another day</button></div>
    <div class="actions"><button class="secondary" id="ePre">Save as preset</button></div>
    <div class="actions"><button class="danger" id="eDel">Delete</button><button class="primary" id="eSave">Save</button></div>`,
  b=>{const q=s=>b.querySelector(s),vals=()=>({name:q('#eName').value.trim()||en.name,kcal:num(q('#eK').value),protein:num(q('#eP').value)});
    const tot=()=>{const v=vals();q('#eTot').textContent=v.kcal==null||v.protein==null?'Enter calories and protein per item.':`Total: ${fmt(v.kcal*qty)} kcal · ${fmtP(v.protein*qty)} g protein`};
    mountQty(b,'eq',()=>qty,v=>{qty=v;tot()});q('#eK').oninput=tot;q('#eP').oninput=tot;tot();
    q('#eSave').onclick=()=>{const v=vals();if(v.kcal==null||v.protein==null)return;
      ref.update({name:v.name,qty,kcalEach:r1(v.kcal),proteinEach:r1(v.protein),kcal:Math.round(v.kcal*qty),protein:r1(v.protein*qty)}).catch(()=>toast('Could not save.'));toast('Saved');closeSheet()};
    q('#ePre').onclick=()=>{const v=vals();if(v.kcal==null||v.protein==null)return;savePreset(v);toast('Saved as preset');closeSheet()};
    q('#eDup').onclick=()=>{const v=vals();if(v.kcal==null||v.protein==null)return;qtySheet({name:v.name,kcalEach:v.kcal,proteinEach:v.protein,src:'quick'},{day:S.today,kicker:'Add to today'})};
    q('#eMove').onclick=()=>moveSheet(en);
    const del=q('#eDel');del.onclick=()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Tap to confirm';return}
      const{id:_,...data}=en;ref.delete().catch(()=>toast('Could not delete.'));if(S.all)S.all=S.all.filter(x=>x.id!==id);toast('Deleted '+en.name,()=>ref.set(data));closeSheet()}});
}
function moveSheet(en){
  let day=en.day===S.today?addDays(S.today,-1):S.today;
  openSheet(`${head('Move '+esc(dispName(en)),'Currently on '+dayLabel(en.day))}${dayPickerHTML}
    <div class="actions"><button class="secondary" id="mBack">Back</button><button class="primary" id="mGo"></button></div>`,
  b=>{const go=b.querySelector('#mGo'),label=()=>{go.textContent=day===en.day?'Already on this day':'Move to '+(day===S.today?'today':dayLabel(day))};
    mountDayPicker(b,()=>day,v=>{day=v;label()});label();
    b.querySelector('#mBack').onclick=()=>editEntry(en.id);
    go.onclick=()=>{if(day===en.day)return;const ref=S.base.collection('entries').doc(en.id),from=en.day;
      ref.update({day}).catch(()=>toast('Could not move that entry.'));if(S.all){const a=S.all.find(x=>x.id===en.id);if(a)a.day=day}
      closeSheet();toast('Moved to '+(day===S.today?'today':dayLabel(day)),()=>ref.update({day:from}).catch(()=>{}))}});
}
function presetsSheet(){
  const draw=(b,q)=>{const list=[...S.presets].filter(p=>!q||p.name.toLowerCase().includes(q)).sort((a,c)=>(c.uses||0)-(a.uses||0)||a.name.localeCompare(c.name));
    b.querySelector('#plist').innerHTML=list.length?list.map(p=>`<div class="prow"><button class="row" data-pid="${esc(p.id)}"><div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="meta">${p.uses?'used '+p.uses+'×':'not used yet'}</div></div><div class="vals num"><b>${fmt(p.kcal)} kcal</b><span>${fmtP(p.protein)} g</span></div></button><button class="x" data-edit="${esc(p.id)}" aria-label="Edit ${esc(p.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>`).join('')
      :`<div class="empty">${q?'No presets match.':'No presets yet. Save things you have often, like your shake, and add them in one tap.'}</div>`};
  openSheet(`${head('Presets')}<input id="pq" placeholder="Search presets" autocomplete="off"><div class="list" id="plist"></div><div class="actions"><button class="primary" id="pNew">New preset</button></div>`,
  b=>{draw(b,'');b.querySelector('#pq').oninput=e=>draw(b,e.target.value.trim().toLowerCase());
    b.querySelector('#plist').onclick=e=>{const ed=e.target.closest('[data-edit]');if(ed){presetForm(S.presets.find(p=>p.id===ed.dataset.edit));return}
      const r=e.target.closest('[data-pid]');if(r){const p=S.presets.find(x=>x.id===r.dataset.pid);if(p)qtySheet(fromPreset(p))}};
    b.querySelector('#pNew').onclick=()=>presetForm(null)});
}
function presetForm(p){
  openSheet(`${head(p?'Edit preset':'New preset')}
    <label class="f">Name<input id="fN" value="${esc(p?p.name:'')}" placeholder="Morning protein shake"></label>
    <div class="fields"><label class="f">Calories (kcal)<input id="fK" inputmode="numeric" value="${p?Math.round(p.kcal):''}"></label><label class="f">Protein (g)<input id="fP" inputmode="decimal" value="${p?fmtP(p.protein):''}"></label></div>
    <div class="err" id="fErr" hidden></div>
    <div class="actions">${p?'<button class="danger" id="fDel">Delete</button>':'<button class="secondary" id="fBack">Back</button>'}<button class="primary" id="fSave">Save preset</button></div>`,
  b=>{const q=s=>b.querySelector(s);
    q('#fSave').onclick=()=>{const n=q('#fN').value.trim(),k=num(q('#fK').value),pr=num(q('#fP').value);
      if(!n||k==null||pr==null){q('#fErr').textContent='Add a name, calories and protein.';q('#fErr').hidden=false;return}
      savePreset({name:n,kcal:k,protein:pr},p&&p.id);toast('Preset saved');presetsSheet()};
    if(q('#fBack'))q('#fBack').onclick=presetsSheet;
    const d=q('#fDel');if(d)d.onclick=()=>{if(!d.classList.contains('armed')){d.classList.add('armed');d.textContent='Tap to confirm';return}
      S.base.collection('presets').doc(p.id).delete().catch(()=>toast('Could not delete.'));toast('Preset deleted');presetsSheet()}});
}
function rulesSheet(){
  const sec=(t,items)=>`<div><div class="kicker" style="margin-bottom:6px">${t}</div><ul style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px">${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
  openSheet(`${head('How data is found')}
    ${sec('Scan',['Reads the barcode on your phone and looks it up in <b>Open Food Facts</b>. These are the product’s own figures, with no AI involved.','Not in the database: you’re asked to photograph the nutrition label instead.'])}
    ${sec('Photo',['Barcode visible: looked up in <b>Open Food Facts</b> first.','Nutrition label visible: <b>Gemini</b> copies the label’s figures.','Front of pack only: Gemini names the product, then the app checks <b>Open Food Facts</b> for it. If it isn’t there, Gemini searches <b>Google</b> for the published figures. If nothing is found, you get Gemini’s typical values, and the note says so.','Plate of food: <b>Gemini</b> estimates each item from the photo.'])}
    ${sec('Typing',['Description and both numbers: saved exactly as typed.','As you type: your past items and presets that match appear above the box (so “mash” finds “Mashed potato”). Tap one, then choose how many and which day.','Exact name of a preset, then Add: opens the amount picker for it.','Description only: <b>Open Food Facts</b> is searched first. Tap a match, or choose to estimate.','Estimates: <b>Gemini</b> searches Google for published figures (useful for brands and chains). If that isn’t available, it estimates from typical UK portions.','One number typed: kept as you entered it, and Gemini fills in the other.'])}
    ${sec('Good to know',['Every result opens on the review card first, so you can change the portion or numbers before saving.','Confidence: <b>high</b> means a label, database or published source. <b>Medium</b> or <b>low</b> means typical values or a visual estimate.','If Gemini is busy, the app retries and then tries backup models. Searching online uses a separate, smaller free allowance.'])}
    <div class="actions"><button class="secondary" id="rBack">Back to Settings</button></div>`,
  b=>b.querySelector('#rBack').onclick=settingsSheet);
}
function settingsSheet(){
  const u=auth.currentUser;
  openSheet(`${head('Settings')}
    <div class="kicker">Daily targets</div>
    <div class="fields"><label class="f">Calorie limit (kcal)<input id="sK" inputmode="numeric" value="${S.settings.kcal}"></label><label class="f">Protein minimum (g)<input id="sP" inputmode="numeric" value="${S.settings.protein}"></label></div>
    <div class="small">Calories are a ceiling to stay under. Protein is a floor to reach. Each day runs from 1am to 1am.</div>
    <div class="kicker">Gemini (photo reading and estimates)</div>
    <label class="f">API key<input id="sKey" type="password" autocomplete="off" placeholder="Paste key from Google AI Studio" value="${esc(lsGet('calpro.gemkey'))}"></label>
    <label class="f">Model<input id="sModel" autocomplete="off" value="${esc(lsGet('calpro.model')||'gemini-flash-latest')}"></label>
    <div class="small">The key is stored on this device only. Get one free at aistudio.google.com.</div>
    <button class="secondary" id="sTest" style="height:44px;border-radius:12px;font-weight:600">Test connections</button>
    <div class="small" id="sTestOut" style="white-space:pre-wrap"></div>
    <button class="secondary" id="sRules" style="height:44px;border-radius:12px;font-weight:600">How data is found</button>
    ${S.hidden.length?`<button class="secondary" id="sUnhide" style="height:44px;border-radius:12px;font-weight:600">Restore hidden Quick add items (${S.hidden.length})</button>`:''}
    <div class="actions"><button class="secondary" data-close>Cancel</button><button class="primary" id="sSave">Save</button></div>
    <div class="small">Signed in as ${esc(u&&(u.email||u.displayName)||'')} · <button id="sOut" style="text-decoration:underline;color:var(--over)">Sign out</button></div>`,
  b=>{const q=s=>b.querySelector(s);
    q('#sSave').onclick=()=>{const k=num(q('#sK').value),p=num(q('#sP').value);
      lsSet('calpro.gemkey',q('#sKey').value.trim());lsSet('calpro.model',q('#sModel').value.trim()==='gemini-flash-latest'?'':q('#sModel').value.trim());
      if(k&&p){S.settings={kcal:Math.round(k),protein:Math.round(p)};S.base.set({settings:S.settings},{merge:true}).catch(()=>toast('Could not save targets.'))}
      if(lsGet('calpro.gemkey'))banner('');render();toast('Settings saved');closeSheet()};
    q('#sOut').onclick=()=>{closeSheet();auth.signOut()};
    q('#sRules').onclick=rulesSheet;
    if(q('#sUnhide'))q('#sUnhide').onclick=()=>{S.hidden=[];render();S.base.set({hiddenChips:[]},{merge:true}).catch(()=>toast('Could not save that change.'));toast('Quick add items restored');q('#sUnhide').remove()};
    q('#sTest').onclick=async()=>{const out=q('#sTestOut'),log=m=>out.textContent+=m+'\n';out.textContent='';
      lsSet('calpro.gemkey',q('#sKey').value.trim());lsSet('calpro.model',q('#sModel').value.trim()==='gemini-flash-latest'?'':q('#sModel').value.trim());
      log('Food database (barcode)…');
      try{const r=await offBarcode('5449000000996');log(r?'  OK: found '+r.name:'  Reached, but no product returned')}catch(e){log('  Failed: '+(e.code||'')+' '+(e.message||e))}
      log('Food database (name search)…');
      try{const l=await offSearch('banana');log('  OK: '+l.length+' matches')}catch(e){log('  Failed: '+(e.code||'')+' '+(e.message||e))}
      log('Gemini ('+(lsGet('calpro.model')||'gemini-flash-latest')+')…');
      try{const r=await gemini([{text:'Reply with only this JSON: {"ok": true}'}]);log(r&&r.ok?'  OK':'  Odd reply: '+JSON.stringify(r).slice(0,120))}catch(e){log('  Failed: '+(e.code??'')+' '+String(e.message||'').slice(0,300))}
      const sp=spentList();log('Skipped until reset: '+(sp.length?sp.join(', '):'none'));
      log('Gemini with Google Search…');
      try{await gemini([{text:'Reply with only this JSON: {"ok": true}'}],{search:true});log('  OK')}catch(e){log('  Failed: '+(e.code??'')+' '+String(e.message||'').slice(0,200))}
    }});
}

/* ===== day rollover and offline service worker ===== */
function tick(){const t=dayKey(Date.now());if(t!==S.today){const was=S.today;S.today=t;if(S.view===was)S.view=t;if(S.base)subscribe(true);render()}}
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
